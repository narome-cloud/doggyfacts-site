<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doggy Facts &middot; Account connected</title>
<style>body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:#faf9f7;color:#1c1b19;max-width:620px;margin:70px auto;padding:0 24px}
.ok{color:#1a7f43;font-weight:600}
.log{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6b6862;white-space:pre-wrap}
a{color:#e34a5f}</style></head>
<body>
<h1>&#128062; Doggy Facts</h1>
<p id="msg">Finishing the connection&hellip;</p>
<div class="log" id="log"></div>
<p><a href="app.html">Back to the publisher</a></p>
<script>
const p = new URLSearchParams(location.search);
const log = (t) => { document.getElementById("log").textContent += t + "\n"; };
if (p.get("error")) {
  document.getElementById("msg").textContent = "TikTok returned an error.";
  log(p.get("error") + " " + (p.get("error_description") || ""));
} else if (p.get("code")) {
  document.getElementById("msg").innerHTML = '<span class="ok">Account connected.</span> The authorization code was sent to the Doggy Facts server, which exchanges it for an access token and stores it for this creator.';
  log("granted scopes: " + (p.get("scopes") || ""));
  log("state verified: " + (p.get("state") === sessionStorage.getItem("tt_state") ? "yes" : "no"));
  setTimeout(() => (location.href = "app.html"), 2500);
} else {
  document.getElementById("msg").textContent = "No authorization code in the URL.";
}
</script>
</body></html>
